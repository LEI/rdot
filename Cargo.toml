[package]
name = "rdot"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["cargo", "derive", "env", "string"] }
color-eyre = "0.6"
console = "0.15.8"
dialoguer = "0.11.0"
dirs = "5.0.1"
indicatif = "0.17.9"
# TODO: dev build only
env_logger = "0.11.5"
gix = { "version" = "0.67.0", "optional" = true }
lazy_static = "1.5.0"
log = "0.4.22"
schemars = { version = "0.8.21", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.133"
shellexpand = "3.1.0"
toml = "0.8.19"

[dev-dependencies]
assert_cmd = { version = "2.0.16", features = ["color"] }
env_logger = "0.11.5"
predicates = "3.1.2"

[features]
default = ["git", "json-schema"]
git = ["gix"]
json-schema = ["schemars"]

[lib]
doctest = false

# Always build backtrace with optimizations
[profile.dev.package.backtrace]
opt-level = 3
